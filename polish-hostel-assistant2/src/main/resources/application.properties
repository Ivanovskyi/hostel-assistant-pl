quarkus.application.name=polish-hostel-assistant

quarkus.http.port=8080

# OpenRouter
quarkus.langchain4j.openai.base-url=https://openrouter.ai/api/v1
quarkus.langchain4j.openai.api-key=${OPENROUTER_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=openrouter/free
quarkus.langchain4j.openai.chat-model.timeout=60s

quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true

tavily.api-key=${TAVILY_API_KEY}
quarkus.rest-client.tavily.url=https://api.tavily.com
quarkus.rest-client.tavily.follow-redirects=true

quarkus.log.category."com.example".level=INFO
